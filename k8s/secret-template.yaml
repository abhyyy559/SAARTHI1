# Secret PLACEHOLDERS for the SAARTHI backend — fill in real values out of band.
#
# These are EMPTY by design: never commit real credentials to git.
# Create the real secret with one of:
#   1. kubectl create secret generic saarthi-backend-secrets -n saarthi \
#        --from-literal=IMD_API_KEY=<redacted> ...        (repeat per key)
#   2. Fill this template, base64-encode the values (stringData shown below
#      takes plain strings; Kubernetes encodes them for you), and apply.
#
# Env names mirror backend/config.py exactly (config reads them via
# os.environ.get("<NAME>", <default>)).
apiVersion: v1
kind: Secret
metadata:
  name: saarthi-backend-secrets
  namespace: saarthi
  labels:
    app.kubernetes.io/part-of: saarthi
type: Opaque
stringData:
  # --- LLM / voice -----------------------------------------------------------
  LLM_API_KEY: ""          # chat LLM (Groq)
  SARVAM_API_KEY: ""       # Sarvam STT + TTS (production stack decision)
  STT_API_KEY: ""          # legacy speech-to-text key
  TTS_API_KEY: ""          # legacy text-to-speech key

  # --- Weather data sources --------------------------------------------------
  IMD_API_KEY: ""          # India Meteorological Dept
  OWM_API_KEY: ""          # OpenWeatherMap (fallback chain)
  DATAGOV_API_KEY: ""      # data.gov.in
  DATAGOV_RESOURCE_ID: ""
  WEATHERAPI_KEY: ""       # weatherapi.com (alert chain)
  WEATHERUNION_KEY: ""     # Zomato Weather Union (alert chain)

  # --- Alert feeds -----------------------------------------------------------
  CAP_FEED_URL: ""         # SACHET/CAP feed
  CAP_FEED_URLS: ""        # extra SACHET state feeds, comma-separated

  # --- Web Push (VAPID) ------------------------------------------------------
  # Pin both so subscriptions survive restarts and replicas agree on one key.
  # Rotate the pair that was previously committed in public git history.
  VAPID_PRIVATE_KEY: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_SUBJECT: ""        # e.g. mailto:ops@yourdomain.example

  # --- Data stores -----------------------------------------------------------
  DATABASE_URL: ""         # Postgres (production path, migrations/001_init.sql)
  REDIS_URL: ""
