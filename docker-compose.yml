services:
  weathergpt:
    build: .
    image: weathergpt:1.0
    env_file:
      - weathergpt/.env
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      PORT: 8000
    ports:
      # host port selectable via WGPT_PORT (default 8000) so it can dodge
      # other local stacks that already bind 8000
      - "${WGPT_PORT:-8000}:8000"
    volumes:
      - wgpt-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:%d/api/health' % int(os.environ.get('PORT','8003')))"]
      interval: 30s
      timeout: 5s
      retries: 3

